# All times in seconds, UTC internally. This service NEVER places orders.
server:
  host: 127.0.0.1
  port: 5056
# Public-only preview for opt-in Funnel. NEVER tunnel port 5056.
public:
  enabled: true
  host: 127.0.0.1
  port: 5057
schedule:
  market_seconds: 180
  news_seconds: 600
  alert_cooldown_seconds: 1800
  max_market_age_seconds: 600
  max_news_age_seconds: 1800
  request_pace_seconds: 1.15   # conservative pacing for BingX 1/s endpoints
  request_timeout_seconds: 10
  retries: 2
risk:
  max_spread_pct: 0.75
  min_book_depth_usd_each_side: 1500
  min_dex_liquidity_usd: 100000
  min_quote_volume_24h_usd: 50000
  max_dex_perp_divergence_pct: 8
  min_required_data_legs: 2
  alert_score_threshold: 60
  # These are research/watchlist alerts, never executable signals.
  min_signal_history_points: 2
narrative:
  lookback_hours: 36
  # Observed only if enabled: date and claims must be rechecked independently.
  event_date: "2026-11-19"
  event_name: "Provisional GTA VI launch date — verify official news"
  event_verified: false

# v0.4: paper analytical signals only. No exchange execution.
signal:
  enabled: true
  timeframe: 5m
  minimum_closed_candles: 100
  sl_atr_mult: 1.5
  tp1_rr: 2.0
  tp2_rr: 3.0
  min_net_rr: 1.2
  fee_bps: 10
  slippage_bps: 10
  volume_ratio_min: 1.15
  expiry_seconds: 14400
  acceptable_max_cost_pct: 1.0
  caution_max_cost_pct: 2.5
  poor_liquidity_max_cost_pct: 5.0
kronos:
  enabled: true          # enabled after validating isolated model environment
  factor_weight: 0.0     # observation, not vote or veto (hard-enforced)
  python: /home/leshanyahu/.local/share/afterburner-kronos/venv/bin/python
  model: NeoQuasar/Kronos-small
  lookback: 400
  samples: 1
  timeout_seconds: 120
  horizons: {5m: 6, 15m: 8, 1h: 6}
